name: MijnMoment checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run smoke tests
        run: node scripts/smoke-test.mjs
      - name: Check required project files
        run: test -f index.html && test -f styles.css && test -f app.js && test -f manifest.webmanifest && test -f assets/mijnmoment-icon.svg
      - name: Package web app
        run: mkdir -p dist && cp index.html styles.css app.js manifest.webmanifest sw.js dist/ && cp -r assets dist/assets
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mijnmoment-web
          path: dist/
