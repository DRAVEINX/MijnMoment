name: MijnMoment checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run smoke tests
        run: node scripts/smoke-test.mjs
      - name: Validate package and Capacitor configuration
        run: node -e "const p=require('./package.json');const c=require('./capacitor.config.json');if(!p.scripts['build:web']||c.appId!=='nl.draveinx.mijnmoment')process.exit(1)"
      - name: Build web app
        run: npm run build:web
      - name: Check required build files
        run: test -f dist/index.html && test -f dist/styles.css && test -f dist/app.js && test -f dist/manifest.webmanifest && test -f dist/assets/mijnmoment-icon.svg
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mijnmoment-web
          path: dist/
