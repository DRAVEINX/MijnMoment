name: MijnMoment signed APK (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MM_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MM_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MM_RELEASE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!name}" ]; then echo "::error::Missing signing secret: $name"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and test
        run: npm install && npm run check && npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Set Android SDK versions
        run: |
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/; s/targetSdkVersion = 35/targetSdkVersion = 36/' android/variables.gradle
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
      - name: Sync Android
        run: npx cap sync android
      - name: Set Android release version
        run: |
          sed -i 's/versionCode 1/versionCode 2/; s/versionName "1.0"/versionName "1.0.0"/' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+2' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1.0.0"' android/app/build.gradle
      - name: Build unsigned release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign and verify release APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MM_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MM_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/mijnmoment-release.jks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mijnmoment-release.jks"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/mijnmoment-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/mijnmoment-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out MijnMoment-1.0.0-release.apk "$RUNNER_TEMP/mijnmoment-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs MijnMoment-1.0.0-release.apk
          test -s MijnMoment-1.0.0-release.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MijnMoment-1.0.0-signed-APK
          path: MijnMoment-1.0.0-release.apk
          if-no-files-found: error
