name: MijnMoment 1.0 signed release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mijnmoment-release-signing
  cancel-in-progress: false
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify selected source revision
        shell: bash
        run: |
          set -euo pipefail
          echo "Building branch: $GITHUB_REF_NAME"
          echo "Building commit: $(git rev-parse HEAD)"
          if grep -q 'Terugknop moet alle functievakken verbergen' scripts/smoke-test.mjs; then
            echo "::error::Old smoke-test detected. Start a NEW workflow run on the main branch (do not re-run an old job)."
            exit 1
          fi
          echo "Updated MijnMoment smoke tests confirmed."
      - name: Check recovery secret
        shell: bash
        env:
          RECOVERY_PASSWORD: ${{ secrets.MM_RELEASE_RECOVERY_PASSWORD }}
        run: |
          if [ "${#RECOVERY_PASSWORD}" -lt 20 ]; then
            echo "::error::Create GitHub Actions secret MM_RELEASE_RECOVERY_PASSWORD with a unique password of at least 20 characters."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and test
        run: npm install && npm run check && npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Set Android SDK versions
        run: |
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/; s/targetSdkVersion = 35/targetSdkVersion = 36/' android/variables.gradle
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
      - name: Sync Android
        run: npx cap sync android
      - name: Set Android release version
        run: |
          sed -i 's/versionCode 1/versionCode 2/; s/versionName "1.0"/versionName "1.0.0"/' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+2' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1.0.0"' android/app/build.gradle
      - name: Prepare protected signing key
        shell: bash
        env:
          RECOVERY_PASSWORD: ${{ secrets.MM_RELEASE_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mm-signing"
          cd "$RUNNER_TEMP/mm-signing"
          if [ -f "$GITHUB_WORKSPACE/.github/release-key/mijnmoment-signing.enc" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
              -in "$GITHUB_WORKSPACE/.github/release-key/mijnmoment-signing.enc" \
              -out bundle.tar.gz -pass env:RECOVERY_PASSWORD
            tar -xzf bundle.tar.gz
          else
            openssl rand -hex 32 > key-password.txt
            STORE_PASS="$(cat key-password.txt)"
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore mijnmoment-release.p12 -alias mijnmoment \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=MijnMoment, OU=Android, O=MijnMoment, C=NL" \
              -storepass "$STORE_PASS" -keypass "$STORE_PASS"
            tar -czf bundle.tar.gz mijnmoment-release.p12 key-password.txt
            mkdir -p "$GITHUB_WORKSPACE/.github/release-key"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
              -in bundle.tar.gz \
              -out "$GITHUB_WORKSPACE/.github/release-key/mijnmoment-signing.enc" \
              -pass env:RECOVERY_PASSWORD
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/release-key/mijnmoment-signing.enc
            git commit -m "Store encrypted MijnMoment release signing backup"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          test -s "$RUNNER_TEMP/mm-signing/mijnmoment-release.p12"
          test -s "$RUNNER_TEMP/mm-signing/key-password.txt"
      - name: Build unsigned release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          export STORE_PASS="$(cat "$RUNNER_TEMP/mm-signing/key-password.txt")"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/mijnmoment-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/mm-signing/mijnmoment-release.p12" \
            --ks-type PKCS12 --ks-key-alias mijnmoment \
            --ks-pass env:STORE_PASS --key-pass env:STORE_PASS \
            --out MijnMoment-1.0.0-release.apk "$RUNNER_TEMP/mijnmoment-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs MijnMoment-1.0.0-release.apk
          test -s MijnMoment-1.0.0-release.apk
      - name: Build and sign Play Store AAB
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew bundleRelease
          cd ..
          export STORE_PASS="$(cat "$RUNNER_TEMP/mm-signing/key-password.txt")"
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$RUNNER_TEMP/mm-signing/mijnmoment-release.p12" \
            -storetype PKCS12 -storepass:env STORE_PASS -keypass:env STORE_PASS \
            -signedjar MijnMoment-1.0.0-google-play.aab \
            android/app/build/outputs/bundle/release/app-release.aab mijnmoment
          jarsigner -verify -strict -certs MijnMoment-1.0.0-google-play.aab
          test -s MijnMoment-1.0.0-google-play.aab
      - name: Upload Google Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MijnMoment-1.0.0-Google-Play-AAB
          path: MijnMoment-1.0.0-google-play.aab
          if-no-files-found: error
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MijnMoment-1.0.0-signed-APK
          path: MijnMoment-1.0.0-release.apk
          if-no-files-found: error
      - name: Upload encrypted key backup
        uses: actions/upload-artifact@v4
        with:
          name: MijnMoment-encrypted-release-key-BACKUP
          path: .github/release-key/mijnmoment-signing.enc
          if-no-files-found: error
